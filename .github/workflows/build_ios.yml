name: Build Flutter iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13 # Standardized on Xcode 15 / stable Swift 5 environment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Build Directories
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p build/macos/SourcePackages

      - name: Disable SPM
        run: flutter config --no-enable-swift-package-manager

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Sage-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sage-iOS-Release
          path: build/ios/iphoneos/Sage-iOS.ipa